syntax = "proto3";

option csharp_namespace = "TISklep.Service.Grpc";
package catalog;

service Catalog {
  rpc GetBoardGames (GetBoardGamesRequest) returns (BoardGamesListResponse);
  rpc GetCategories (EmptyRequest) returns (CategoryListResponse);
  rpc PurchaseBoardGames (PurchaseRequest) returns (PurchaseResponse);
}

message EmptyRequest {}

message GetBoardGamesRequest {
  string category = 1;
  bool sort_by_category_asc = 2;
}

message BoardGamesDto {
  int32 id = 1;
  string title = 2;
  string category = 3;
  double price = 4;
  string description = 5;
  int32 stock = 6;
}

message BoardGamesListResponse {
  repeated BoardGamesDto boardGames = 1;
}

message CategoryDto {
  int32 id = 1;
  string name = 2;
}

message CategoryListResponse {
  repeated CategoryDto categories = 1;
}

message PurchaseItemDto {
  int32 board_game_id = 1;
  int32 quantity = 2;
}
message PurchaseRequest {
  repeated PurchaseItemDto items = 1;
}

message PurchaseResponse {
  bool success = 1;
  string message = 2;
  int32 order_id = 3;
}